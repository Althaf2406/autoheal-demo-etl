name: ETL Data Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        id: etl
        run: |
          python etl/pipeline.py

      - name: Run Unit Tests
        if: success()
        run: |
          pytest tests/

      - name: Notify AutoHeal Agent on Failure
        if: failure() && github.event_name != 'pull_request' && env.AUTOHEAL_WEBHOOK_URL != ''
        env:
          AUTOHEAL_WEBHOOK_URL: ${{ secrets.AUTOHEAL_WEBHOOK_URL }}
        run: |
          echo "Pipeline failed! Sending error report to AutoHeal Webhook..."
          ERROR_LOG=$(python etl/pipeline.py 2>&1 | tail -n 80)
          PAYLOAD=$(jq -n \
            --arg err "$ERROR_LOG" \
            --arg repo "${{ github.repository }}" \
            --arg file "etl/pipeline.py" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{error_log: $err, repo: $repo, file_path: $file, branch: $branch, commit: $commit, run_url: $run_url}')
          
          curl -X POST "$AUTOHEAL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
